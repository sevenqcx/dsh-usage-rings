<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magpie 额度</title>
<style>
:root{color-scheme:light dark;--bg:#fbfbf9;--tx:#1d1d1f;--sub:#86868b;--line:#e8e8e6;--track:#ececea;--fill:#6e6e70;--bad:#e5484d;--btn:#f2f2f0}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f21;--tx:#f2f2f4;--sub:#9a9aa0;--line:#333336;--track:#333336;--fill:#b8b8bc;--btn:#2a2a2d}}
*{box-sizing:border-box}
body{margin:0;padding:18px 22px 14px;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;min-width:340px;max-width:420px}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.hd{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:6px}
.hd b{color:var(--tx);font-size:14px;font-weight:600}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--sub)}
.w{margin-top:10px}
.w .t{font-size:15px;margin-bottom:6px}
.w.low .t{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--fill)}
.w.low .bar i{background:var(--bad)}
.m{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.m .r{color:var(--sub)}
.big{font-size:20px;font-weight:600;margin-top:6px}
.note{color:var(--sub);font-size:12.5px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
button.s{background:var(--btn);border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:2px 10px;cursor:pointer;font:inherit;font-size:12.5px}
button.s.danger{color:var(--bad);border-color:var(--bad)}
.foot{display:flex;justify-content:space-between;color:var(--sub);font-size:12.5px;padding-top:10px;border-top:1px solid var(--line)}
.foot button{background:none;border:0;color:var(--sub);cursor:pointer;font:inherit}
</style>
<div id="list"></div>
<div class="foot"><span id="stamp">读取中…</span><button id="refresh">刷新</button></div>
<script type="module">
import { App } from '@modelcontextprotocol/ext-apps';
const app = new App({ name: 'Magpie 额度', version: '1.2.1' }, {}, { autoResize: true });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const left = (w) => w.remaining != null ? w.remaining : (w.used != null ? 100 - w.used : null);
const NAMES = { '5 hours': '5 小时', '7 days': '周限', 'Image generation': '生图', 'Total credits': '总额度' };
const hm = (d) => d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
function rel(iso) {
  if (!iso) return ''; const ms = new Date(iso) - Date.now(); if (ms <= 0) return '已重置';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return (h >= 24 ? Math.floor(h / 24) + '天 ' + (h % 24) + '小时' : h ? h + '小时 ' + m + '分钟' : m + '分钟') + '后重置';
}
async function call(name, args) {
  try {
    const r = await app.callServerTool({ name, arguments: args || {} });
    if (r.isError) return { ok: false };
    if (r.structuredContent) return { ok: true, result: r.structuredContent };
    const t = (r.content || []).find((b) => b.type === 'text');
    return { ok: true, result: t ? JSON.parse(t.text) : null };
  } catch (e) { return { ok: false }; }
}
function win(w) {
  const p = left(w), q = p == null ? 0 : Math.max(0, Math.min(100, p)), low = p != null && p <= 10;
  const amt = w.limit != null && w.amount != null ? ' · ' + w.amount + '/' + Number(w.limit).toLocaleString('en-US') : '';
  return '<div class="w' + (low ? ' low' : '') + '"><div class="t">' + esc(NAMES[w.name] || w.display || w.name) + '</div>' +
    '<div class="bar"><i style="width:' + q + '%"></i></div>' +
    '<div class="m"><span>剩余 ' + (p == null ? '—' : Math.round(p) + '%') + esc(amt) + '</span><span class="r">' + esc(rel(w.resetsAt)) + '</span></div></div>';
}
function sec(title, tag, body, extra) {
  return '<div class="sec"><div class="hd"><b>' + esc(title) + '</b>' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + (extra || '') + '</div>' + body + '</div>';
}
function mainSec(title, d, extra) {
  const ws = d && d.windows || [];
  return sec(title, d && d.account, (ws.length ? ws.map(win).join('') : '<div class="note">暂无数据（Magpie 没开？）</div>') + (extra || ''), '');
}
function other(o) {
  const chk = /workbuddy/i.test(o.provider) && !/ai/i.test(o.provider) ? '<button class="s" id="checkin">签到</button>' : '';
  let body;
  if (o.status !== 'available') body = '<div class="note">读取失败 ' + esc(o.errorText || '') + '</div>';
  else if (!(o.windows || []).length && o.balance) body = '<div class="big">' + esc(o.balance) + '</div><div class="note">可用余额</div>';
  else body = (o.windows || []).map(win).join('') || '<div class="note">' + esc((o.notes || [])[0] || '暂无') + '</div>';
  return sec(o.provider, '', body, chk);
}
let armed = null;
function cards(res) {
  const a = res && res.accounts || [];
  if (!a.length) return '';
  return a.map((x) => x.each.map((c) => '<div class="row"><span>重置卡 · ' + new Date(c.until).toLocaleDateString('zh-CN') + ' 到期</span><button class="s" data-u="' + esc(x.user) + '" data-c="' + esc(c.id) + '">使用</button></div>').join('')).join('');
}
async function load() {
  $('refresh').disabled = true;
  const [u, c] = await Promise.all([call('magpie_usage'), call('codex_reset_cards')]);
  $('refresh').disabled = false;
  if (!u.ok || !u.result) { $('stamp').textContent = '读取失败'; return; }
  const R = u.result;
  $('list').innerHTML = mainSec('Codex', R.codex, cards(c.ok ? c.result : null)) + mainSec('Gemini · Antigravity', R.antigravity) + (R.others || []).map(other).join('');
  $('stamp').textContent = 'Magpie · 更新于 ' + hm(new Date());
  document.querySelectorAll('[data-c]').forEach((b) => b.onclick = async () => {
    if (armed !== b) { if (armed) { armed.textContent = '使用'; armed.classList.remove('danger'); } armed = b; b.textContent = '再点确认'; b.classList.add('danger'); return; }
    b.disabled = true; b.textContent = '使用中…';
    const r = await call('codex_use_reset_card', { user: b.dataset.u, credit: b.dataset.c });
    b.textContent = r.ok && r.result && r.result.completed ? '已重置 ✅' : '失败'; armed = null; setTimeout(load, 1500);
  });
  const k = $('checkin');
  if (k) k.onclick = async () => { k.disabled = true; k.textContent = '…'; const r = await call('workbuddy_checkin'); k.disabled = false; k.textContent = r.ok && r.result && r.result.completed ? '已签 ✅' : '失败'; };
}
$('refresh').onclick = load;
app.onteardown = async () => ({});
try { await app.connect(); await load(); setInterval(load, 60000); } catch (e) { $('stamp').textContent = '页面未连接，请重新打开'; }
</script>
</html>
